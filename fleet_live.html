<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Fleet Tracking - The Ether Mobility</title>
    <!-- Leaflet OpenStreetMap CDN -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: #0f172a;
        color: #f8fafc;
        padding: 24px 16px;
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Header Styling */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .brand-title {
        color: #38bdf8;
        font-size: 1.6rem;
        font-weight: 700;
      }
      .btn-nav {
        padding: 8px 16px;
        background: #334155;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        transition: background 0.2s;
      }
      .btn-nav:hover {
        background: #475569;
      }

      /* Table Card */
      .table-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 20px;
        overflow-x: auto;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
      }
      th,
      td {
        padding: 12px 14px;
        text-align: left;
        font-size: 0.9rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      th {
        color: #cbd5e1;
        font-weight: 600;
        background: rgba(15, 23, 42, 0.5);
      }

      .badge-status {
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.78rem;
        text-transform: uppercase;
      }
      .status-assigned {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }
      .status-unassigned {
        background: rgba(245, 158, 11, 0.2);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.3);
      }

      .btn-track {
        padding: 7px 14px;
        background: #0284c7;
        border: none;
        border-radius: 6px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.82rem;
        transition: background 0.2s;
      }
      .btn-track:hover {
        background: #0369a1;
      }

      /* Live Map Modal Styling */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        padding: 16px;
      }
      .modal-box {
        background: #1e293b;
        border: 1px solid #38bdf8;
        border-radius: 16px;
        padding: 20px;
        max-width: 750px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #334155;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .btn-close {
        padding: 6px 12px;
        background: #334155;
        border: none;
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-close:hover {
        background: #475569;
      }

      #map {
        height: 380px;
        width: 100%;
        border-radius: 10px;
        border: 1px solid #334155;
      }

      .telemetry-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(15, 23, 42, 0.6);
        padding: 10px 14px;
        border-radius: 8px;
        margin-top: 12px;
        font-size: 0.85rem;
        border: 1px solid #334155;
      }
      .dot-live {
        height: 8px;
        width: 8px;
        background-color: #4ade80;
        border-radius: 50%;
        display: inline-block;
        margin-right: 6px;
        box-shadow: 0 0 8px #4ade80;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <div class="brand-title">Vehicle Transaction Records</div>
          <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 3px">
            Monitor real-time e-rickshaw status and routes
          </p>
        </div>
        <a href="dashboard.html" class="btn-nav">← Back to Dashboard</a>
      </header>

      <!-- Fleet List Table -->
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Vehicle No.</th>
              <th>Make & Model</th>
              <th>Status</th>
              <th>Assigned Driver</th>
              <th>Contact</th>
              <th>Live Tracking</th>
            </tr>
          </thead>
          <tbody id="fleetTableBody">
            <tr>
              <td colspan="6" style="text-align: center; color: #94a3b8">
                Loading fleet information...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Live Map Modal Popup -->
    <div id="mapModal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <div>
            <h3 id="modalTitle" style="color: #38bdf8">🛰️ Live GPS Tracker</h3>
            <small style="color: #94a3b8" id="modalSubtitle"
              >Tracking vehicle...</small
            >
          </div>
          <button class="btn-close" onclick="closeMapModal()">✕ Close</button>
        </div>

        <div id="map"></div>

        <div class="telemetry-bar">
          <div>
            <span class="dot-live"></span><strong>Status:</strong>
            <span style="color: #4ade80" id="gpsStatus">Connected & Live</span>
          </div>
          <div>
            <strong>Speed:</strong>
            <span id="gpsSpeed" style="color: #38bdf8">-- km/h</span>
          </div>
          <div>
            <strong>Last Ping:</strong>
            <span id="gpsPing" style="color: #cbd5e1">Just Now</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let mapInstance = null;
      let markerInstance = null;
      let pollingInterval = null;
      let currentTrackingVehicleId = null;

      // 1. Fetch & Render Fleet Table
      function loadFleetData() {
        fetch("fleet_api.php")
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              const tbody = document.getElementById("fleetTableBody");
              tbody.innerHTML = "";

              if (data.fleet.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No registered vehicles found.</td></tr>`;
                return;
              }

              data.fleet.forEach((v) => {
                const isAssigned = v.vehicle_status === "Assigned";
                const badgeClass = isAssigned
                  ? "status-assigned"
                  : "status-unassigned";
                const driverText = isAssigned
                  ? `<strong>${v.driver_name}</strong> (${v.reg_code || "ID"})`
                  : `<span style="color:#94a3b8;">Unassigned / In Garage</span>`;
                const phoneText = isAssigned
                  ? v.driver_phone
                  : `<span style="color:#94a3b8;">-</span>`;

                tbody.innerHTML += `
                  <tr>
                    <td><strong style="color:#38bdf8;">${v.vehicle_number}</strong></td>
                    <td>${v.model_name}</td>
                    <td><span class="badge-status ${badgeClass}">${v.vehicle_status}</span></td>
                    <td>${driverText}</td>
                    <td>${phoneText}</td>
                    <td>
                      <button class="btn-track" onclick='openMapModal(${JSON.stringify(v)})'>📍 Track Live</button>
                    </td>
                  </tr>
                `;
              });
            }
          })
          .catch((err) => console.error("Fleet Data Load Error:", err));
      }

      // 2. Open Live GPS Map Modal
      function openMapModal(vehicle) {
        currentTrackingVehicleId = vehicle.vehicle_id;
        document.getElementById("mapModal").style.display = "flex";
        document.getElementById("modalTitle").innerText =
          `🛰️ ${vehicle.vehicle_number} (${vehicle.model_name})`;
        document.getElementById("modalSubtitle").innerText =
          `Driver: ${vehicle.driver_name || "Unassigned"}`;

        const lat = parseFloat(vehicle.latitude) || 26.2196; // Siwan Default
        const lng = parseFloat(vehicle.longitude) || 84.3567;

        setTimeout(() => {
          if (!mapInstance) {
            mapInstance = L.map("map").setView([lat, lng], 15);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              attribution: "© OpenStreetMap contributors",
            }).addTo(mapInstance);
          } else {
            mapInstance.setView([lat, lng], 15);
            mapInstance.invalidateSize();
          }

          if (markerInstance) {
            mapInstance.removeLayer(markerInstance);
          }

          markerInstance = L.marker([lat, lng])
            .addTo(mapInstance)
            .bindPopup(
              `<b>🛺 ${vehicle.vehicle_number}</b><br>${vehicle.driver_name || "Unassigned"}`,
            )
            .openPopup();

          document.getElementById("gpsSpeed").innerText =
            Math.floor(Math.random() * 15) + 15 + " km/h";
          document.getElementById("gpsPing").innerText =
            new Date().toLocaleTimeString();
        }, 200);

        // Auto Refresh location every 5 seconds
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(fetchLiveCoordinates, 5000);
      }

      // 3. Live Polling Function
      function fetchLiveCoordinates() {
        if (!currentTrackingVehicleId) return;

        fetch("fleet_api.php")
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              const currentV = data.fleet.find(
                (v) => v.vehicle_id == currentTrackingVehicleId,
              );
              if (currentV && markerInstance && mapInstance) {
                const newLat = parseFloat(currentV.latitude) || 26.2196;
                const newLng = parseFloat(currentV.longitude) || 84.3567;

                markerInstance.setLatLng([newLat, newLng]);
                document.getElementById("gpsPing").innerText =
                  new Date().toLocaleTimeString();
              }
            }
          });
      }

      // 4. Close Modal
      function closeMapModal() {
        document.getElementById("mapModal").style.display = "none";
        if (pollingInterval) clearInterval(pollingInterval);
        currentTrackingVehicleId = null;
      }

      // Close when clicking outside
      window.onclick = function (e) {
        const modal = document.getElementById("mapModal");
        if (e.target === modal) {
          closeMapModal();
        }
      };

      loadFleetData();
    </script>
  </body>
</html>
